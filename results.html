<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Results - Creativity Generation Schools</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة Chart.js والمكون الإضافي للنسب المئوية -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  
  <style>
    :root {
      --primary-color: #0a5c53;
      --accent-gold: #cfa851;
      --bg-gradient: linear-gradient(135deg, #f4f8f7 0%, #e6efed 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); padding: 20px 15px; color: #2c3e50; }

    .header {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { height: 65px; object-fit: contain; }

    .title-box {
      text-align: center;
      margin-bottom: 25px;
    }
    .title-box h1 { color: var(--primary-color); font-size: 2rem; }
    .title-box p { color: var(--accent-gold); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }

    /* شبكة 5 أعمدة بالضبط (صفين كل صف 5 أسئلة) */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 1450px;
      margin: 0 auto;
    }

    @media (max-width: 1200px) {
      .results-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .results-grid { grid-template-columns: repeat(1, 1fr); }
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border-top: 4px solid var(--accent-gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
      min-height: 48px;
      color: var(--primary-color);
      line-height: 1.3;
      text-align: center;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 170px;
      height: 170px;
    }

    /* أزرار التحكم في أسفل الصفحة */
    .footer-control {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn-control {
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .dashboard-btn {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(10, 92, 83, 0.25);
    }
    .dashboard-btn:hover {
      background-color: #07433c;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(10, 92, 83, 0.35);
    }

    .reset-btn {
      background-color: #d9534f;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(217, 83, 79, 0.25);
    }
    .reset-btn:hover {
      background-color: #c9302c;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 83, 79, 0.35);
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo_creativity.png" alt="Creativity Generation Schools" class="logo">
    <img src="logo_cognia.png" alt="Cognia Logo" class="logo">
  </div>

  <div class="title-box">
    <p>Live Dashboard</p>
    <h1>Voting Results Overview</h1>
  </div>

  <!-- شبكة النتائج: صفين، كل صف 5 أسئلة -->
  <div class="results-grid" id="resultsGrid"></div>

  <!-- الأزرار أسفل الصفحة -->
  <div class="footer-control">
    <a href="dashboard.html" class="btn-control dashboard-btn">Go to Dashboard 📊</a>
    <button class="btn-control reset-btn" id="resetBtn">Reset All Votes</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    Chart.register(ChartDataLabels);

    const firebaseConfig = {
      apiKey: "AIzaSyBCZ6VNFF7EMIXQupKOpDQwNPeCd9xPhiM",
      authDomain: "live-voting-app-e4569.firebaseapp.com",
      databaseURL: "https://live-voting-app-e4569-default-rtdb.firebaseio.com",
      projectId: "live-voting-app-e4569",
      storageBucket: "live-voting-app-e4569.firebasestorage.app",
      messagingSenderId: "736380741973",
      appId: "1:736380741973:web:2df55912219d70b8a2e7dc",
      measurementId: "G-70Z8ZGYPVV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // قائمة الأسئلة الجديدة المحدثة
    const questions = [
      "Pacing: Have you ever realized mid-year that you spent too much time on one unit?",
      "Prior Knowledge: Do you know precisely which specific skills students were taught last year?",
      "Redundancy: Have you ever taught a topic only to find students already did it?",
      "Continuity: Could a new colleague easily follow your year-long instructional roadmap?",
      "Horizontal Alignment: Do you and your department teach core standards at roughly the same pace?",
      "Curriculum Gaps: Have you discovered a critical prerequisite skill missing across your class?",
      "Living Resources: Is your current syllabus something you actively edit throughout the year?",
      "Assessment Alignment: Does every daily assessment feed into end-of-year outcomes?",
      "Teacher Isolation: Have you ever felt like you were planning in a silo?",
      "Efficiency: Would you like a centralized system that saves you planning time?"
    ];

    const grid = document.getElementById('resultsGrid');
    const charts = {};

    questions.forEach((q, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${i + 1}. ${q}</div>
        <div class="chart-container">
          <canvas id="chart-q${i+1}"></canvas>
        </div>
      `;
      grid.appendChild(card);

      const ctx = document.getElementById(`chart-q${i+1}`).getContext('2d');
      charts[`q${i+1}`] = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['YES', 'NO'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#0a5c53', '#d9534f'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, font: { size: 11 } }
            },
            datalabels: {
              color: '#ffffff',
              font: { weight: 'bold', size: 12 },
              formatter: (value, ctx) => {
                const dataset = ctx.chart.data.datasets[0];
                const total = dataset.data.reduce((acc, val) => acc + val, 0);
                if (total === 0 || value === 0) return '';
                const percentage = Math.round((value / total) * 100);
                return `${percentage}%`;
              }
            }
          }
        }
      });
    });

    const votesRef = ref(db, 'votes');
    onValue(votesRef, (snapshot) => {
      const data = snapshot.val() || {};
      
      questions.forEach((_, i) => {
        const qKey = `q${i + 1}`;
        const yesVotes = data[qKey]?.yes || 0;
        const noVotes = data[qKey]?.no || 0;

        const chart = charts[qKey];
        if (chart) {
          chart.data.datasets[0].data = [yesVotes, noVotes];
          chart.update();
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm("Are you sure you want to reset all voting data to zero?")) {
        const resetData = {};
        questions.forEach((_, i) => {
          resetData[`q${i + 1}`] = { yes: 0, no: 0 };
        });
        set(votesRef, resetData).then(() => {
          alert("All votes have been reset successfully!");
        }).catch((err) => {
          alert("Error resetting votes: " + err.message);
        });
      }
    });
  </script>
</body>
</html>
