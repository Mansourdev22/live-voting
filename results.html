<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Results - Creativity Generation Schools</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة Chart.js والمكون الإضافي للنسب المئوية -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  
  <style>
    :root {
      --primary-color: #0a5c53;
      --accent-gold: #cfa851;
      --bg-gradient: linear-gradient(135deg, #f4f8f7 0%, #e6efed 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); padding: 20px 15px; color: #2c3e50; }

    .header {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { height: 65px; object-fit: contain; }

    .title-box {
      text-align: center;
      margin-bottom: 25px;
    }
    .title-box h1 { color: var(--primary-color); font-size: 2rem; }
    .title-box p { color: var(--accent-gold); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }

    /* شبكة 5 كروت في الصف */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (max-width: 1200px) {
      .results-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .results-grid { grid-template-columns: repeat(1, 1fr); }
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border-top: 4px solid var(--accent-gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      min-height: 40px;
      color: var(--primary-color);
      line-height: 1.3;
      text-align: center;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 190px;
      height: 190px;
    }

    /* حاوي الأزرار أسفل الصفحة */
    .footer-control {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-control {
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .dashboard-btn {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(10, 92, 83, 0.25);
    }
    .dashboard-btn:hover {
      background-color: #07433c;
      transform: translateY(-2px);
    }

    .reset-btn {
      background-color: #d9534f;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(217, 83, 79, 0.25);
    }
    .reset-btn:hover {
      background-color: #c9302c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo_creativity.png" alt="Creativity Generation Schools" class="logo">
    <img src="logo_cognia.png" alt="Cognia Logo" class="logo">
  </div>

  <div class="title-box">
    <p>Live Dashboard</p>
    <h1>Voting Results Overview</h1>
  </div>

  <div class="results-grid" id="resultsGrid"></div>

  <!-- الأزرار التفاعلية في أسفل الصفحة -->
  <div class="footer-control">
    <a href="dashboard.html" class="btn-control dashboard-btn">Go to Dashboard 📊</a>
    <button class="btn-control reset-btn" id="resetBtn">Reset All Votes</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // تسجيل إضافة ChartDataLabels لإظهار النسبة على الشارت
    Chart.register(ChartDataLabels);

    const firebaseConfig = {
      apiKey: "AIzaSyBCZ6VNFF7EMIXQupKOpDQwNPeCd9xPhiM",
      authDomain: "live-voting-app-e4569.firebaseapp.com",
      databaseURL: "https://live-voting-app-e4569-default-rtdb.firebaseio.com",
      projectId: "live-voting-app-e4569",
      storageBucket: "live-voting-app-e4569.firebasestorage.app",
      messagingSenderId: "736380741973",
      appId: "1:736380741973:web:2df55912219d70b8a2e7dc",
      measurementId: "G-70Z8ZGYPVV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const questions = [
      "Was your academic major your own choice?",
      "Is teaching your chosen career?",
      "Do you enjoy the educational stage you are currently teaching?",
      "Do you believe in your mission as an educator?",
      "Were you a quiet student in school?",
      "Were you a student who preferred sitting in the back?",
      "Were you a social student?",
      "Were you a student council member?",
      "Do you believe in multiple intelligences?",
      "Do you have a special talent?"
    ];

    const grid = document.getElementById('resultsGrid');
    const charts = {};

    questions.forEach((q, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${i + 1}. ${q}</div>
        <div class="chart-container">
          <canvas id="chart-q${i+1}"></canvas>
        </div>
      `;
      grid.appendChild(card);

      const ctx = document.getElementById(`chart-q${i+1}`).getContext('2d');
      charts[`q${i+1}`] = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['YES', 'NO'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#0a5c53', '#d9534f'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, font: { size: 11 } }
            },
            datalabels: {
              color: '#ffffff',
              font: { weight: 'bold', size: 12 },
              formatter: (value, ctx) => {
                const dataset = ctx.chart.data.datasets[0];
                const total = dataset.data.reduce((acc, val) => acc + val, 0);
                if (total === 0 || value === 0) return '';
                const percentage = Math.round((value / total) * 100);
                return `${percentage}%`;
              }
            }
          }
        }
      });
    });

    const votesRef = ref(db, 'votes');
    onValue(votesRef, (snapshot) => {
      const data = snapshot.val() || {};
      
      questions.forEach((_, i) => {
        const qKey = `q${i + 1}`;
        const yesVotes = data[qKey]?.yes || 0;
        const noVotes = data[qKey]?.no || 0;

        const chart = charts[qKey];
        if (chart) {
          chart.data.datasets[0].data = [yesVotes, noVotes];
          chart.update();
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm("Are you sure you want to reset all voting data to zero?")) {
        const resetData = {};
        questions.forEach((_, i) => {
          resetData[`q${i + 1}`] = { yes: 0, no: 0 };
        });
        set(votesRef, resetData).then(() => {
          alert("All votes have been reset successfully!");
        }).catch((err) => {
          alert("Error resetting votes: " + err.message);
        });
      }
    });
  </script>
</body>
</html>
