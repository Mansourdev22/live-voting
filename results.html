<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Results - Creativity Generation Schools</title>
  <!-- Chart.js & Google Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #0a5c53;
      --accent-gold: #cfa851;
      --bg-gradient: linear-gradient(135deg, #f4f8f7 0%, #e6efed 100%);
      --card-bg: #ffffff;
      --text-dark: #2c3e50;
      --yes-color: #0a5c53;
      --no-color: #d9534f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; padding: 30px 20px; color: var(--text-dark); }

    /* Top Navigation / Navigation Actions */
    .top-bar { max-width: 1200px; margin: 0 auto 20px; display: flex; justify-content: flex-end; }
    .btn-dashboard {
      background-color: var(--accent-gold);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(207, 168, 81, 0.3);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-dashboard:hover {
      background-color: #b89343;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(207, 168, 81, 0.4);
    }

    /* Header Section */
    .header { max-width: 1200px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { height: 75px; object-fit: contain; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1)); }
    .page-title { text-align: center; color: var(--primary-color); font-size: 1.8rem; font-weight: 700; }

    /* Cards Grid Layout */
    .results-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(10, 92, 83, 0.08);
      border-top: 5px solid var(--primary-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 15px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
    }

    .stats-footer {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #edf2f7;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .stat-yes { color: var(--yes-color); }
    .stat-no { color: var(--no-color); }
  </style>
</head>
<body>

  <!-- Top Action Button -->
  <div class="top-bar">
    <a href="dashboard.html" class="btn-dashboard">
      📊 Open Executive Dashboard →
    </a>
  </div>

  <!-- Header Section with Logos -->
  <div class="header">
    <img src="logo_creativity.png" alt="Creativity Generation Schools Logo" class="logo">
    <h1 class="page-title">Live Voting Results</h1>
    <img src="logo_cognia.png" alt="Cognia Logo" class="logo">
  </div>

  <!-- Grid Container for Questions -->
  <div class="results-grid" id="gridContainer">
    <!-- 10 Chart Cards dynamically generated -->
  </div>

  <!-- Firebase Realtime Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCZ6VNFF7EMIXQupKOpDQwNPeCd9xPhiM",
      authDomain: "live-voting-app-e4569.firebaseapp.com",
      databaseURL: "https://live-voting-app-e4569-default-rtdb.firebaseio.com",
      projectId: "live-voting-app-e4569",
      storageBucket: "live-voting-app-e4569.firebasestorage.app",
      messagingSenderId: "736380741973",
      appId: "1:736380741973:web:2df55912219d70b8a2e7dc",
      measurementId: "G-70Z8ZGYPVV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const questions = [
      "Was your academic major your own choice?",
      "Is teaching your chosen career?",
      "Do you enjoy the educational stage you are currently teaching?",
      "Do you believe in your mission as an educator?",
      "Were you a quiet student in school?",
      "Were you a student who preferred sitting in the back?",
      "Were you a social student?",
      "Were you a student council member?",
      "Do you believe in multiple intelligences?",
      "Do you have a special talent?"
    ];

    const charts = {};

    // 1. Build Grid structure HTML
    const gridContainer = document.getElementById('gridContainer');
    questions.forEach((qText, index) => {
      const qIndex = index + 1;
      const card = document.createElement('div');
      card.className = 'question-card';
      card.innerHTML = `
        <div class="q-title">Q${qIndex}. ${qText}</div>
        <div class="chart-container">
          <canvas id="chart_q${qIndex}"></canvas>
        </div>
        <div class="stats-footer">
          <span class="stat-yes">YES: <span id="val_yes_q${qIndex}">0</span></span>
          <span class="stat-no">NO: <span id="val_no_q${qIndex}">0</span></span>
        </div>
      `;
      gridContainer.appendChild(card);
    });

    // 2. Initialize Pie Charts
    questions.forEach((_, index) => {
      const qIndex = index + 1;
      const ctx = document.getElementById(`chart_q${qIndex}`).getContext('2d');
      charts[`q${qIndex}`] = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['YES', 'NO'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#0a5c53', '#d9534f'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    });

    // 3. Listen to Firebase Realtime Database
    const votesRef = ref(db, 'votes');
    onValue(votesRef, (snapshot) => {
      const data = snapshot.val() || {};

      questions.forEach((_, index) => {
        const qKey = `q${index + 1}`;
        const yesVal = data[qKey]?.yes || 0;
        const noVal = data[qKey]?.no || 0;

        // Update UI text values
        document.getElementById(`val_yes_${qKey}`).innerText = yesVal;
        document.getElementById(`val_no_${qKey}`).innerText = noVal;

        // Update Chart
        const chart = charts[qKey];
        if (chart) {
          chart.data.datasets[0].data = [yesVal, noVal];
          chart.update();
        }
      });
    });
  </script>
</body>
</html>
